name: CI

# Executes notebook.ipynb with the pinned packages and checks that it runs
# without error outputs and reproduces tables/summary_key_results.csv.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-route:
    name: Repo route (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt

      - name: Install pinned packages
        shell: bash
        run: python -m pip install -r requirements.txt -c constraints.txt

      - name: Execute notebook
        shell: bash
        run: >-
          python -m jupyter nbconvert --to notebook --execute
          --ExecutePreprocessor.timeout=1800
          --output executed.ipynb notebook.ipynb

      - name: Fail on error outputs
        shell: bash
        run: |
          python - executed.ipynb <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              nb = json.load(f)
          errors = [
              (i, out.get("ename"), out.get("evalue"))
              for i, cell in enumerate(nb["cells"])
              for out in cell.get("outputs", [])
              if out.get("output_type") == "error"
          ]
          for i, name, value in errors:
              print(f"cell {i}: {name}: {value}")
          print(f"{len(errors)} error outputs in {len(nb['cells'])} cells")
          sys.exit(1 if errors else 0)
          PY

      - name: Fail if summary table changed
        shell: bash
        run: git diff --ignore-cr-at-eol --exit-code tables/summary_key_results.csv

  upload-route:
    name: Upload route (notebook alone, ubuntu-latest, Python 3.12)
    # Fetches the datasets over the network, so it runs on manual dispatch only.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt

      - name: Install pinned packages
        shell: bash
        run: python -m pip install -r requirements.txt -c constraints.txt

      - name: Execute notebook alone in an empty folder
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/upload-route"
          cp notebook.ipynb "$RUNNER_TEMP/upload-route/"
          cd "$RUNNER_TEMP/upload-route"
          ls -A
          python -m jupyter nbconvert --to notebook --execute \
            --ExecutePreprocessor.timeout=1800 \
            --output-dir "$RUNNER_TEMP" --output executed.ipynb notebook.ipynb

      - name: Fail on error outputs
        shell: bash
        run: |
          python - "$RUNNER_TEMP/executed.ipynb" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              nb = json.load(f)
          errors = [
              (i, out.get("ename"), out.get("evalue"))
              for i, cell in enumerate(nb["cells"])
              for out in cell.get("outputs", [])
              if out.get("output_type") == "error"
          ]
          for i, name, value in errors:
              print(f"cell {i}: {name}: {value}")
          print(f"{len(errors)} error outputs in {len(nb['cells'])} cells")
          sys.exit(1 if errors else 0)
          PY

      - name: Fail if summary table differs from the committed one
        shell: bash
        run: >-
          git diff --no-index --ignore-cr-at-eol --exit-code
          tables/summary_key_results.csv
          "$RUNNER_TEMP/upload-route/tables/summary_key_results.csv"
